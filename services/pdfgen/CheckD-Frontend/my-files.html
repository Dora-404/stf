<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CheckD — My files</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css"/>
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .checklist-row {
            width: 100%;
            border: 1px solid black;
            border-radius: 15px;
            box-shadow: 2px 2px 8px 4px rgba(0, 0, 0, 0.2);
            padding: 1rch 1rch 1em 1em;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="javascript:void(0)">CheckD Checklist system</a>
        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Global checklists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="edit.html">Checklist editor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="export.html">Export results</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="my-files.html">My files</a>
                </li>
            </ul>
            <div class="d-flex">
                <button class="btn btn-primary me-2" type="button" data-bs-toggle="modal" data-bs-target="#uploadFileModal">Add new file</button>
                <div class="btn-group" id="nav-user-group" hidden>
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" id="nav-user-button">User</button>
                    <div class="dropdown-menu dropdown-menu-end">
                        <a class="dropdown-item" href="edit.html">My checklists</a>
                        <a class="dropdown-item" href="my-files.html">My files</a>
                        <button class="dropdown-item" type="button" id="check-session-btn">Check session</button>
                        <button class="dropdown-item" type="button" id="logout-btn">Logout</button>
                    </div>
                </div>
                <button class="btn btn-primary" type="button" id="nav-login-button">Login/Register</button>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid" style="margin-top:80px; margin-bottom:40px;">
    <div id="list-result"></div>
    <div class="container" style="margin-top: 1em;">
        <div class="checklist-row">
            <h4 class="mb-3">My files</h4>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Filename</th>
                        <th scope="col">Size</th>
                        <th scope="col">Created at</th>
                        <th scope="col" class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="files-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="uploadFileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Upload file</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">File</label>
                    <input type="file" class="form-control" id="file-upload-input">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="upload-filename">Filename (stored as)</label>
                    <input type="text" class="form-control" id="upload-filename" placeholder="Uses file name when empty">
                </div>
                <div id="upload-modal-error"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="confirm-upload-btn">Upload</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="sessionCheckModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Session check result</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">Success: <span id="session-check-success">no</span></p>
                <p class="mb-2">Session valid: <span id="session-check-valid">no</span></p>
                <p class="mb-0">Error: <span id="session-check-error">null</span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="js/app-config.js"></script>
<script src="js/my-files-page.js"></script>
</body>
</html>
