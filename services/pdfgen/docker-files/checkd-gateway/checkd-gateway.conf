# Публичный фронт + API (8081): без /api/export/* и без export-answer.html.
server {
    listen 0.0.0.0:8081;
    listen [::]:8081;
    server_name localhost;

    root /var/www/html;
    index index.html;

    access_log /var/log/nginx/access-8081.log combined;
    error_log  /var/log/nginx/error-8081.log warn;

    location ^~ /api/export/ {
        return 403;
    }

    location = /export-answer.html {
        return 403;
    }

    # Загрузка файла: лимит тела как в Swift (`userFileNewBodyMaxBytes` = 36 * 1024 * 1024).
    location = /api/files/new {
        client_max_body_size 37748736;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:5005;
        fastcgi_param path "$request_uri";
        fastcgi_param method "$request_method";
    }

    # Остальные API: до 65535 байт тела (как `readBytes(..., limit: 65535)` в контроллерах).
    location /api/ {
        client_max_body_size 65535;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:5005;
        fastcgi_param path "$request_uri";
        fastcgi_param method "$request_method";
    }

    # /pdf-files/… → CheckD Print service …/files/… (сниппет из entrypoint: CHECKD_PRINT_SERVICE_*).
    include /etc/nginx/snippets/pdf-proxy.conf;

    # SSO: публичный ключ token-verfer (том `token_verfer_keys` → /var/lib/checkd/token-verfer).
    location = /keys/public.key {
        alias /var/lib/checkd/token-verfer/public.key;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Внутренний vhost (8084): только экспорт + статика для страницы; наружу не публикуем.
server {
    listen 0.0.0.0:8084;
    listen [::]:8084;
    server_name localhost;

    root /var/www/html;
    index index.html;

    access_log /var/log/nginx/access-8084.log combined;
    error_log  /var/log/nginx/error-8084.log warn;

    location /api/export/ {
        client_max_body_size 65535;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:5005;
        fastcgi_param path "$request_uri";
        fastcgi_param method "$request_method";
    }

    location = /export-answer.html {
        try_files $uri =404;
    }

    location ^~ /js/ {
        try_files $uri =404;
    }

    location ^~ /bootstrap-5.3.8-dist/ {
        try_files $uri =404;
    }

    location / {
        return 403;
    }
}
