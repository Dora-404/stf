# Часть конфига статична; блок /files/ подставляется из entrypoint (FILESTORE_PATH).
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /var/www/html;
    index index.html;

    include /etc/nginx/filestore-location.conf;

    location /print-service/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;

        include fastcgi_params;
        fastcgi_pass 127.0.0.1:5004;
        # Кастомные параметры для backend
        fastcgi_param path "$request_uri";
        fastcgi_param method "$request_method";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
