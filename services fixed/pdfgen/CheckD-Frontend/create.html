<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CheckD Main</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css"/>
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .checklist-row {
            width: 100%;
            border: 1px solid black;
            border-radius: 15px;
            box-shadow: 2px 2px 8px 4px rgba(0, 0, 0, 0.2);
            padding: 1rch 1rch 1em 1em;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="javascript:void(0)">CheckD Checklist system</a>
        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Global checklists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="edit.html">Checklist editor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="export.html">Export results</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="my-files.html">My files</a>
                </li>
            </ul>
            <div class="d-flex">
                <div class="btn-group" id="nav-user-group" hidden>
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" id="nav-user-button">User #14881357</button>
                    <div class="dropdown-menu dropdown-menu-end">
                        <a class="dropdown-item" href="edit.html">My checklists</a>
                        <a class="dropdown-item" href="my-files.html">My files</a>
                        <button class="dropdown-item" type="button" id="check-session-btn">Check session</button>
                        <button class="dropdown-item" type="button" id="logout-btn">Logout</button>
                    </div>
                </div>
                <button class="btn btn-primary" type="button" id="nav-login-button">Login/Register</button>
            </div>
        </div>
    </div>
</nav>
<div class="container-fluid" style="margin-top:80px; margin-bottom:40px;">
    <div class="container" style="margin-top: 1em;">
        <div class="checklist-row">
            <div id="save-result"></div>
            <h4 class="mt-2 mb-2" id="checklist-title">Checklist editor</h4>
            <p class="mb-2" id="checklist-description-text"></p>
            <div class="mb-3">
                <span class="badge text-bg-primary me-2" id="checklist-public-badge">Public</span>
                <span class="badge text-bg-secondary" id="checklist-hidden-badge">Visible</span>
            </div>

            <h5 class="mt-4">Questions</h5>
            <table class="table">
                <tbody id="questions-container"></tbody>
            </table>

            <div class="row">
                <div class="col">
                    <button type="button" class="btn btn-secondary" id="add-question-open-btn">Add new question</button>
                    <button type="button" class="btn btn-success" id="save-checklist-btn">Save</button>
                    <button type="button" class="btn btn-danger" id="discard-checklist-btn">Discard</button>
                </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="questionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="question-modal-title">Create new question</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3 mt-3">
                    <label for="q-title" class="form-label">Question title</label>
                    <input type="text" class="form-control" id="q-title" placeholder="Enter title">
                </div>
                <div class="mb-3 mt-3">
                    <label for="q-desc" class="form-label">Question description</label>
                    <textarea class="form-control" id="q-desc" placeholder="Enter description"></textarea>
                </div>
                <div class="mb-3 mt-3">
                    <label for="q-type" class="form-label">Question type</label>
                    <select class="form-control" id="q-type">
                        <option value="bool" selected>Yes/No</option>
                        <option value="single">Single answer</option>
                        <option value="multi">Multiple answer</option>
                        <option value="text">Text answer</option>
                    </select>
                </div>
                <div class="mb-3 mt-3" id="question-values-section">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <p class="form-label mb-0">Answer values</p>
                        <button type="button" class="btn btn-secondary btn-sm" id="add-answer-btn">Add answer</button>
                    </div>
                    <div id="question-values-container"></div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="create-question-btn">Create</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="sessionCheckModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Session check result</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">Success: <span id="session-check-success">no</span></p>
                <p class="mb-2">Session valid: <span id="session-check-valid">no</span></p>
                <p class="mb-0">Error: <span id="session-check-error">null</span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
</body>
<script src="js/app-config.js"></script>
<script src="js/create-page.js"></script>
</html>
